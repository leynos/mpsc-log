# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Official names: Azure Architecture Center and GitHub Flavored Markdown.
accepted = []

[words.corrections]

[patterns]
ignore = [
    "\\bAzure Architecture\\s+Center \\| Microsoft Learn\\b",
    "\\bGitHub Flavored\\s+Markdown\\b",
    # Inline code spans quote identifiers verbatim, so they are not en-GB
    # prose; the shared base previously supplied this exemption, so this
    # restores it locally.
    "`[^`\\n]+`",
    # `mold` names the Rust linker tool (github.com/rui314/mold), not a
    # misspelling of the en-GB "mould". Scoped to the estate's known
    # phrasings rather than a bare word-boundary match, so unrelated prose
    # (e.g. "the bread had mold growing on it") still gets flagged.
    "-fuse-ld=mold",
    "mold linker",
    "Cranelift \\+ mold",
    "Cranelift and mold",
    "`mold`",
]

[files]
exclude = []
